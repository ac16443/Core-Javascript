<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction of JavaScript</title>
   
<link rel="icon" type="image/x-icon" href="icon/js-icon.png">
<link rel="stylesheet" href="style.css"/>
<script src="js/script.js"></script>

</head>
<body>
  
<div class="container">
<h3>Question 3: Sum 2 different values</h3>
  <label>Value A: </label><input id="inputA" type="number" value="0"/>
<label>Value B:</label><input id="inputB" type="number" value="0"/> <button id="btn-sum">Sum</button>
<div id="result">Total:0</div>
</div> 

<!-- You Can create your own js file or you can also write your js logic in script tag -->
<script> 

let valueA= document.getElementById('inputA');
let valueB= document.getElementById('inputB');
let sum = document.getElementById('btn-sum');
let result = document.getElementById('result')
sum.addEventListener("click", ()=>
{
    let totalVal = Number(valueA.value) + Number(valueB.value);
console.log("From event listener", totalVal)
result.textContent = "Total: " + totalVal;
})

</script>

</body>

</html>
